name: Sort coverage table alphabetically
description: >
  Sorts the first markdown table in code-coverage-results.md alphabetically
  by name column, keeping the summary row last.
runs:
  using: composite
  steps:
    - shell: bash
      run: python3 "$GITHUB_ACTION_PATH/sort.py"
