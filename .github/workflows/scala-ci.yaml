name: Scala CI

on:
  workflow_call:
    outputs:
      coverage:
        description: >-
          Integer line-coverage percentage produced by the coverage shard,
          or an empty string when no shard set `coverage: true`. Suitable to
          feed into the `update-badges` reusable workflow's `coverage-data`.
        value: ${{ jobs.coverage-output.outputs.coverage }}
      matrix-status:
        description: >-
          JSON array of per-shard build results
          `[{ "name", "os", "arch", "passed" }]`, one entry per matrix shard.
        value: ${{ jobs.matrix-output.outputs.matrix-status }}
    inputs:
      working-directory:
        description: >-
          Path (relative to the repo root) where the sbt/Scala workspace
          lives. Used as the working directory for build / test /
          coverage. Also used as the prefix when resolving
          `cobertura-path` and when hashing sbt build files for the cache
          key.
        required: false
        type: string
        default: '.'
      java-version:
        description: JDK version passed to actions/setup-java.
        required: false
        type: string
        default: '21'
      java-distribution:
        description: JDK distribution passed to actions/setup-java (e.g. 'temurin').
        required: false
        type: string
        default: 'temurin'
      os-list:
        description: >-
          JSON array of runner labels for the build-and-test matrix.
          Examples: '["ubuntu-latest"]', '["ubuntu-latest","macos-latest"]'.
          Coverage report generation (staging, summary, PR comment, job
          summary, artifact upload) only runs on the `ubuntu-latest`
          shard; if your matrix excludes `ubuntu-latest`, no coverage
          report will be produced. Ignored when `build-matrix` is set.
          When both `os-list` and `build-matrix` are empty, the matrix
          defaults by repository visibility: public repos get
          ubuntu-latest + windows-latest + macos-latest (coverage on
          ubuntu); private and internal repos get a single shard on the
          self-hosted Hetzner pool (`["self-hosted","hetzner"]`).
        required: false
        type: string
        default: ''
      build-matrix:
        description: >-
          Optional JSON array of build shards, each an object
          `{ "name": <label>, "runner": <runner>, "coverage": <bool> }`.
          When non-empty it fully replaces `os-list`: each entry becomes one
          `build-and-test` shard, `runner` is passed verbatim to `runs-on`
          (a plain label, or a JSON array of labels such as
          ["self-hosted", "hetzner"] to require multiple labels), and
          `coverage` (default false) selects the shard that produces the
          coverage report, sticky PR comment, job summary, and artifact
          upload. At most one entry may set `coverage: true` (zero is
          allowed — no report is then produced). Use this to mix self-hosted
          and hosted runners.
        required: false
        type: string
        default: ''
      matrix-mode:
        description: >-
          Cost-routing override for the build-and-test matrix. `cheap`
          collapses the matrix to a single FREE self-hosted Hetzner shard
          (`["self-hosted","hetzner"]`, coverage on), ignoring `os-list` and
          `build-matrix` — use it to route paid GitHub-hosted legs onto idle
          self-hosted runners. `full` forces the normal matrix (visibility
          default, `os-list`, or `build-matrix`). Empty (the default) defers
          to the org/repo variable `CI_MATRIX_MODE`. Precedence: this input
          over `CI_MATRIX_MODE` over the normal matrix.
        required: false
        type: string
        default: ''
      cobertura-path:
        description: >-
          Path (relative to `working-directory`) of the Cobertura XML
          report emitted by `sbt coverageReport`. Fragile across Scala
          major versions — the default targets Scala 2.13; bump this
          input when upgrading the consuming project to a new Scala
          major.
        required: false
        type: string
        default: 'target/scala-2.13/coverage-report/cobertura.xml'
      coverage-pr-comment-header:
        description: >-
          Hidden HTML-comment dedup key used by
          marocchino/sticky-pull-request-comment to find and rewrite its
          own comment on re-runs — NOT shown to the reader. Make this
          unique per language / per repo (e.g. 'scala-coverage') so multiple
          sticky coverage comments on the same PR don't collide. For the
          visible heading, see `coverage-title`. Note: this shares the
          same default string as `coverage-artifact-name` but the two are
          unrelated knobs — this one keys the PR comment, the other
          names the uploaded Cobertura artifact.
        required: false
        type: string
        default: 'scala-coverage'
      coverage-artifact-name:
        description: >-
          Name of the uploaded Cobertura artifact (actions/upload-artifact
          `name:` input). Must not collide with other coverage artifacts
          uploaded by sibling jobs in the same workflow run (e.g. a
          parallel `csharp-ci` job). Note: this shares the same default
          string as `coverage-pr-comment-header` but the two are
          unrelated knobs — this one names the artifact, the other keys
          the PR comment.
        required: false
        type: string
        default: 'scala-coverage'
      artifact-prefix:
        description: >-
          Prefix applied to per-run artifact names (coverage-percent,
          ci-result-<shard>) to namespace them by language. Set a distinct
          value per language when multiple CI workflows (e.g. csharp-ci and
          scala-ci) run as sibling jobs in the same caller run, so their
          run-level artifacts don't collide.
        required: false
        type: string
        default: 'scala'
      coverage-title:
        description: >-
          Heading prepended to the rendered coverage report so a reader
          can tell the language at a glance when multiple coverage sticky
          comments coexist on the same PR. Default identifies the
          language. Rendered as a markdown H2.
          `coverage-pr-comment-header` is HTML-comment-only, so the
          rendered comment shows ONLY this H2 — no doubling.
        required: false
        type: string
        default: 'Scala coverage'
      sbt-command:
        description: >-
          Arguments passed to `sbt` for the build/test/coverage step.
          Override for advanced cases; the default runs a clean,
          coverage-instrumented test pass and emits a Cobertura report.
          Implementation note: the step runs `eval "sbt $SBT_COMMAND"` to
          preserve embedded quoting in the default value, so this input
          MUST come from a trusted caller (the caller's workflow file,
          not a webhook payload). If this workflow ever grows a
          `workflow_dispatch` trigger, that is a precondition violation —
          the maintainer must switch to a no-eval shape before exposing
          this input to untrusted input sources.
        required: false
        type: string
        default: "-batch -no-colors 'clean; coverage; test; coverageReport'"

jobs:
  normalize:
    name: normalize matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: peacefulstudio/github-actions
          ref: ${{ job.workflow_sha }}
          path: .github-actions-helpers
      - name: Compute effective matrix
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MATRIX: ${{ inputs.build-matrix }}
          OS_LIST: ${{ inputs.os-list }}
          MATRIX_MODE: ${{ inputs.matrix-mode != '' && inputs.matrix-mode || vars.CI_MATRIX_MODE }}
        run: |
          set -euo pipefail
          mode=$(printf '%s' "$MATRIX_MODE" | tr '[:upper:]' '[:lower:]')
          visibility=""
          if [ "$mode" = "cheap" ] || { [ -z "$BUILD_MATRIX" ] && [ -z "$OS_LIST" ]; }; then
            visibility=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')
            if [ -z "$visibility" ]; then
              echo "::error::could not determine repository visibility (empty result from gh api)" >&2
              exit 1
            fi
          fi
          matrix=$(.github-actions-helpers/scripts/normalize-ci-matrix.sh "$BUILD_MATRIX" "$OS_LIST" "$visibility" "$MATRIX_MODE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build-and-test (${{ matrix.name }})
    needs: normalize
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.normalize.outputs.matrix) }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Cache sbt
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles(format('{0}/build.sbt', inputs.working-directory), format('{0}/project/build.properties', inputs.working-directory), format('{0}/project/plugins.sbt', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Setup sbt
        uses: sbt/setup-sbt@4ed7b7ec4bfa2074fe48554c09e341267397247c # v1.2.0

      - name: Build, test, coverage report
        env:
          SBT_COMMAND: ${{ inputs.sbt-command }}
        run: |
          set -euo pipefail
          eval "sbt $SBT_COMMAND"

      - name: Stage Cobertura report for summary
        if: ${{ matrix.coverage }}
        env:
          COBERTURA_PATH: ${{ inputs.cobertura-path }}
        run: |
          set -euo pipefail
          mkdir -p coverage/merged
          cp "$COBERTURA_PATH" coverage/merged/Cobertura.xml

      - name: Checkout CI helpers
        if: ${{ matrix.coverage }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: peacefulstudio/github-actions
          ref: ${{ job.workflow_sha }}
          path: .github-actions-helpers

      - name: Extract coverage percentage
        if: ${{ matrix.coverage }}
        working-directory: ${{ github.workspace }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          .github-actions-helpers/scripts/extract_coverage.py "$WORKING_DIRECTORY/coverage/merged/Cobertura.xml" > coverage/coverage-percent.txt

      - name: Upload coverage value
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-percent
          path: coverage/coverage-percent.txt
          if-no-files-found: error
          retention-days: 1

      - name: Code Coverage Summary Report
        if: ${{ matrix.coverage }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: '${{ inputs.working-directory }}/coverage/merged/Cobertura.xml'
          badge: true
          format: 'markdown'
          hide_complexity: true
          output: 'both'

      - name: Sort coverage table alphabetically
        if: ${{ matrix.coverage }}
        uses: ./.github-actions-helpers/.github/actions/sort-coverage-table

      - name: Prepend coverage title
        if: ${{ matrix.coverage }}
        working-directory: ${{ github.workspace }}
        env:
          COVERAGE_TITLE: ${{ inputs.coverage-title }}
        run: |
          set -euo pipefail
          if [ ! -f code-coverage-results.md ]; then
            echo "::error::code-coverage-results.md not produced by irongut/CodeCoverageSummary — check the filename input and the staged Cobertura path"
            exit 1
          fi
          printf '## %s\n\n' "$COVERAGE_TITLE" | cat - code-coverage-results.md > code-coverage-results.tmp
          mv code-coverage-results.tmp code-coverage-results.md

      - name: Add Coverage PR Comment
        if: ${{ matrix.coverage && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          header: ${{ inputs.coverage-pr-comment-header }}
          path: code-coverage-results.md

      - name: Write to Job Summary
        if: ${{ matrix.coverage }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -f code-coverage-results.md ]; then
            echo "::error::code-coverage-results.md not produced by irongut/CodeCoverageSummary — check the filename input and the staged Cobertura path"
            exit 1
          fi
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cobertura coverage artifact
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.cobertura-path }}
          retention-days: 14

      - name: Record shard result
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          SHARD_NAME: ${{ matrix.name }}
          SHARD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p ci-result
          printf '%s %s\n' "$SHARD_NAME" "$SHARD_STATUS" > "ci-result/${SHARD_NAME}.txt"

      - name: Upload shard result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-ci-result-${{ matrix.name }}
          path: ci-result/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 1

  coverage-output:
    name: coverage-output
    needs: build-and-test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.read.outputs.coverage }}
    steps:
      - name: Download coverage value
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-percent
          path: coverage

      - name: Read coverage value
        id: read
        run: |
          set -euo pipefail
          coverage=""
          if [ -f coverage/coverage-percent.txt ]; then
            coverage=$(tr -d '[:space:]' < coverage/coverage-percent.txt)
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  matrix-output:
    name: matrix-output
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix-status: ${{ steps.aggregate.outputs.matrix-status }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: peacefulstudio/github-actions
          ref: ${{ job.workflow_sha }}
          path: .github-actions-helpers

      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-ci-result-*
          path: ci-results
          merge-multiple: true

      - name: Aggregate shard results
        id: aggregate
        run: |
          set -euo pipefail
          status="$(.github-actions-helpers/scripts/aggregate_matrix_status.py ci-results)"
          echo "matrix-status=$status" >> "$GITHUB_OUTPUT"
