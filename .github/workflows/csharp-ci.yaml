# Caller contract — what your repo must provide for this reusable workflow to
# work end-to-end with xUnit v3 + Microsoft.Testing.Platform (MTP):
#
#   * Directory.Packages.props pinning:
#       - xunit.v3                                  3.2.2
#       - Microsoft.Testing.Extensions.CodeCoverage <same as the workflow
#         input dotnet-coverage-version, default 18.0.6>
#     The MTP coverage extension version is pinned deliberately and the
#     `dotnet-coverage-version` workflow input is the single source of truth
#     for the matching global tool used at merge time. Keep the package
#     version in Directory.Packages.props aligned with that input. See
#     peacefulstudio/canton-ledger-api-csharp#79 for the MTP 1.x / 2.x
#     compatibility rationale — do not bump CodeCoverage past 18.0.x until
#     xunit.v3 ships an MTP 2.x build; newer 19.x lines have produced empty
#     cobertura output in this pipeline.
#
#   * tests/Directory.Build.props (or equivalent) setting:
#       <UseMicrosoftTestingPlatformRunner>true</UseMicrosoftTestingPlatformRunner>
#       <TestingPlatformDotnetTestSupport>true</TestingPlatformDotnetTestSupport>
#       <TestingPlatformCommandLineArguments>--coverage --coverage-output-format cobertura --settings $(MSBuildThisFileDirectory)../coverage.settings.xml</TestingPlatformCommandLineArguments>
#     (The exact arguments live in the caller — what matters is that MTP runs
#     in-process and emits `*.cobertura.xml` files somewhere under tests/.)
#
#   * For multi-TFM test projects, set a per-TFM cobertura filename to avoid
#     silent overwrites between target frameworks:
#       <TestingPlatformCommandLineArguments>... --coverage-output $(MSBuildProjectName)_$(TargetFramework).cobertura.xml</TestingPlatformCommandLineArguments>
#     Single-TFM projects can omit this.
#
#   * coverage.settings.xml at the repo root (or wherever
#     TestingPlatformCommandLineArguments points), tuning the coverage
#     collector. Prefer exclude-only `<ModulePaths>` (e.g. exclude test
#     assemblies, third-party DLLs) rather than an include-list — an
#     include-only `<ModulePaths>` silently drops any new production
#     assembly that isn't listed and produces drifting coverage numbers
#     with no error.
#
#   * Coverlet removed from every test .csproj — MTP's
#     Microsoft.Testing.Extensions.CodeCoverage replaces it. Mixing the two
#     produces duplicate or empty cobertura reports.
#
# Callers that haven't migrated yet (still on xUnit v2 + coverlet) cannot
# pin to this workflow — they must stay on a previous SHA / tag until they
# follow the steps above.

name: CSharp CI

on:
  workflow_call:
    secrets:
      BOT_GITHUB_TOKEN:
        description: >-
          PAT or GitHub App token with `read:packages` for `dotnet restore`
          against private NuGet feeds (e.g. GitHub Packages). Optional;
          omit for public-only restores. Pass via `secrets: inherit` or an
          explicit `secrets:` block on the caller.
        required: false
    inputs:
      concurrency-group:
        description: >-
          Override concurrency group (defaults to workflow + ref). Set this
          when the caller invokes csharp-ci from multiple jobs in the same
          workflow on the same ref and each should run in parallel.
        required: false
        type: string
        default: ''
      dotnet-version:
        description: .NET SDK version passed to actions/setup-dotnet.
        required: false
        type: string
        default: '10.0.x'
      working-directory:
        description: >-
          Path (relative to the repo root) where the .NET workspace lives.
          Used as the working directory for restore / build / test / pack.
        required: false
        type: string
        default: '.'
      os-list:
        description: >-
          JSON array of runner labels for the build-and-test matrix.
          Examples: '["ubuntu-latest"]', '["ubuntu-latest","macos-latest","windows-latest"]'.
          Coverage report generation (merge, summary, PR comment, job summary)
          only runs on the `ubuntu-latest` shard; if your matrix excludes
          `ubuntu-latest`, no coverage report will be produced.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      test-project:
        description: >-
          Optional path (relative to working-directory) of a specific test
          project or solution to pass to `dotnet test`. Empty runs the
          workspace default (the .sln/.slnx in working-directory).
        required: false
        type: string
        default: ''
      test-filter:
        description: >-
          Argument forwarded to `dotnet test --filter`. Empty disables
          filtering. Example: 'Category!=Integration'.
        required: false
        type: string
        default: ''
      coverage-pr-comment-header:
        description: >-
          Header used by marocchino/sticky-pull-request-comment so multiple
          coverage comments on the same PR don't collide. Make this unique
          per language / per repo (e.g. 'csharp-coverage').
        required: false
        type: string
        default: 'csharp-coverage'
      dotnet-coverage-version:
        description: >-
          Version of the `dotnet-coverage` global tool used to merge the
          per-project cobertura reports MTP produces. Pinned by default;
          override only if you need to track a newer line.
        required: false
        type: string
        default: '18.0.6'
      tests-glob:
        description: >-
          Glob (relative to working-directory) used to locate the per-project
          `*.cobertura.xml` files emitted by MTP's coverage extension. The
          default narrows to `bin/Release/net*/` so that stale cobertura
          files left over in source-controlled or scratch directories do
          not get merged. Adjust if your tests live outside a top-level
          `tests/` directory or target a non-Release configuration.
        required: false
        type: string
        default: 'tests/**/bin/Release/net*/**/*.cobertura.xml'
      pack:
        description: >-
          Whether to run `dotnet pack` and upload the resulting .nupkg as a
          workflow artifact. When true, `pack-project` is required.
        required: false
        type: boolean
        default: false
      pack-project:
        description: >-
          Path (relative to working-directory) of the project to pack.
          Required when `pack` is true.
        required: false
        type: string
        default: ''
      pack-output:
        description: >-
          Path (relative to working-directory) of the directory where
          `dotnet pack` writes .nupkg files. Must not start with `./` or
          contain `..` segments — actions/upload-artifact rejects relative
          pathing in its `path:` input. Validated at runtime.
        required: false
        type: string
        default: 'artifacts'
      artifact-name:
        description: Name of the uploaded nupkg artifact.
        required: false
        type: string
        default: 'nupkg'

concurrency:
  group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install dotnet-coverage
        if: matrix.os == 'ubuntu-latest'
        env:
          DOTNET_COVERAGE_VERSION: ${{ inputs.dotnet-coverage-version }}
        run: |
          set -euo pipefail
          dotnet tool update -g dotnet-coverage --version "$DOTNET_COVERAGE_VERSION"

      - name: Restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet restore

      - name: Build
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore

      - name: Test with MTP coverage
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          args=(test --configuration Release --no-build)
          if [ -n "$TEST_FILTER" ]; then
            args+=(--filter "$TEST_FILTER")
          fi
          if [ -n "$TEST_PROJECT" ]; then
            args+=("$TEST_PROJECT")
          fi
          dotnet "${args[@]}"

      - name: Merge per-project cobertura reports
        if: matrix.os == 'ubuntu-latest'
        env:
          TESTS_GLOB: ${{ inputs.tests-glob }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          shopt -s globstar nullglob
          # shellcheck disable=SC2206  # intentional word-split: $TESTS_GLOB is a glob pattern (sourced from inputs.tests-glob via env:), expanded under globstar+nullglob
          cobertura_files=($TESTS_GLOB)
          if [ ${#cobertura_files[@]} -eq 0 ]; then
            echo "::error::No .cobertura.xml files produced under '$TESTS_GLOB' — did MTP coverage extension run? See the caller-contract comment at the top of csharp-ci.yaml."
            exit 1
          fi
          echo "Merging ${#cobertura_files[@]} cobertura files: ${cobertura_files[*]}"
          dotnet-coverage merge \
            -o coverage/merged.cobertura.xml \
            -f cobertura \
            "${cobertura_files[@]}"

      - name: Code Coverage Summary Report
        if: matrix.os == 'ubuntu-latest'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: '${{ inputs.working-directory }}/coverage/merged.cobertura.xml'
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          header: ${{ inputs.coverage-pr-comment-header }}
          path: code-coverage-results.md

      - name: Write to Job Summary
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -f code-coverage-results.md ]; then
            echo "::error::code-coverage-results.md not produced by irongut/CodeCoverageSummary — check the filename input and the merged cobertura path"
            exit 1
          fi
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

  pack:
    name: pack
    if: ${{ inputs.pack }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate inputs
        working-directory: ${{ github.workspace }}
        env:
          PACK_PROJECT: ${{ inputs.pack-project }}
          PACK_OUTPUT: ${{ inputs.pack-output }}
        run: |
          set -euo pipefail
          if [ -z "$PACK_PROJECT" ]; then
            echo "::error::pack-project input is required when pack=true"
            exit 1
          fi
          case "$PACK_OUTPUT" in
            /*|./*|..|../*|*/..|*/../*)
              echo "::error::pack-output must be a relative path without './' prefix or '..' path segments (got: $PACK_OUTPUT)"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet restore

      - name: Pack
        env:
          PACK_PROJECT: ${{ inputs.pack-project }}
          PACK_OUTPUT: ${{ inputs.pack-output }}
        run: |
          set -euo pipefail
          dotnet pack "$PACK_PROJECT" \
            --configuration Release \
            --output "$PACK_OUTPUT"

      - name: Compute artifact path
        id: artifact-path
        working-directory: ${{ github.workspace }}
        env:
          WD: ${{ inputs.working-directory }}
          PO: ${{ inputs.pack-output }}
        run: |
          set -euo pipefail
          if [ "$WD" = "." ] || [ -z "$WD" ]; then
            path="$PO/*.nupkg"
          else
            path="$WD/$PO/*.nupkg"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.artifact-path.outputs.path }}
          if-no-files-found: error
