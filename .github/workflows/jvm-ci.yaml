name: JVM CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Path (relative to the repo root) where the sbt/Scala workspace
          lives. Used as the working directory for build / test /
          coverage. Also used as the prefix when resolving
          `cobertura-path` and when hashing sbt build files for the cache
          key.
        required: false
        type: string
        default: '.'
      java-version:
        description: JDK version passed to actions/setup-java.
        required: false
        type: string
        default: '21'
      java-distribution:
        description: JDK distribution passed to actions/setup-java (e.g. 'temurin').
        required: false
        type: string
        default: 'temurin'
      os-list:
        description: >-
          JSON array of runner labels for the build-and-test matrix.
          Examples: '["ubuntu-latest"]', '["ubuntu-latest","macos-latest"]'.
          Coverage report generation (staging, summary, PR comment, job
          summary, artifact upload) only runs on the `ubuntu-latest`
          shard; if your matrix excludes `ubuntu-latest`, no coverage
          report will be produced.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      cobertura-path:
        description: >-
          Path (relative to `working-directory`) of the Cobertura XML
          report emitted by `sbt coverageReport`. Fragile across Scala
          major versions — the default targets Scala 2.13; bump this
          input when upgrading the consuming project to a new Scala
          major.
        required: false
        type: string
        default: 'target/scala-2.13/coverage-report/cobertura.xml'
      coverage-pr-comment-header:
        description: >-
          Header used by marocchino/sticky-pull-request-comment so
          multiple coverage comments on the same PR don't collide. Make
          this unique per language / per repo (e.g. 'jvm-coverage').
        required: false
        type: string
        default: 'jvm-coverage'
      coverage-artifact-name:
        description: >-
          Name of the uploaded Cobertura artifact. Must not collide with
          other coverage artifacts uploaded by sibling jobs in the same
          workflow run (e.g. a parallel `csharp-ci` job).
        required: false
        type: string
        default: 'jvm-coverage'
      coverage-title:
        description: >-
          Heading prepended to the rendered coverage report so a reader
          can tell the language at a glance when multiple coverage sticky
          comments coexist on the same PR. Default identifies the
          language. Rendered as a markdown H2.
        required: false
        type: string
        default: 'JVM coverage'
      sbt-command:
        description: >-
          Arguments passed to `sbt` for the build/test/coverage step.
          Override for advanced cases; the default runs a clean,
          coverage-instrumented test pass and emits a Cobertura report.
        required: false
        type: string
        default: "-batch -no-colors 'clean; coverage; test; coverageReport'"

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v5.0.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Cache sbt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles(format('{0}/build.sbt', inputs.working-directory), format('{0}/project/build.properties', inputs.working-directory), format('{0}/project/plugins.sbt', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Setup sbt
        uses: sbt/setup-sbt@4ed7b7ec4bfa2074fe48554c09e341267397247c # v1.2.0

      - name: Build, test, coverage report
        env:
          SBT_COMMAND: ${{ inputs.sbt-command }}
        run: |
          set -euo pipefail
          eval "sbt $SBT_COMMAND"

      - name: Stage Cobertura report for summary
        if: matrix.os == 'ubuntu-latest'
        env:
          COBERTURA_PATH: ${{ inputs.cobertura-path }}
        run: |
          set -euo pipefail
          mkdir -p coverage/merged
          cp "$COBERTURA_PATH" coverage/merged/Cobertura.xml

      - name: Code Coverage Summary Report
        if: matrix.os == 'ubuntu-latest'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: '${{ inputs.working-directory }}/coverage/merged/Cobertura.xml'
          badge: true
          format: 'markdown'
          output: 'both'

      - name: Prepend coverage title
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        env:
          COVERAGE_TITLE: ${{ inputs.coverage-title }}
        run: |
          set -euo pipefail
          if [ -f code-coverage-results.md ]; then
            printf '## %s\n\n' "$COVERAGE_TITLE" | cat - code-coverage-results.md > code-coverage-results.tmp
            mv code-coverage-results.tmp code-coverage-results.md
          fi

      - name: Add Coverage PR Comment
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          header: ${{ inputs.coverage-pr-comment-header }}
          path: code-coverage-results.md

      - name: Write to Job Summary
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Cobertura coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.cobertura-path }}
          retention-days: 14
